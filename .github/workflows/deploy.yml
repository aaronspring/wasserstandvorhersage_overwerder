name: Deploy

# Erzeugt stuendlich frische Daten (BSH + PEGELONLINE), baut das React-Frontend
# und deployt es nach GitHub Pages. data.json wird nicht committet, sondern beim
# Build frisch erzeugt und ins Pages-Artefakt gebacken. Stuendlich ist der
# Sweet Spot: neue BSH-Kurven landen zeitnah, die Over-Messung bleibt frisch;
# oefter lohnt kaum, da BSH nur wenige Male pro Tag neu rechnet.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "wasserstand_overwerder/**"
      - "export_web.py"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Sync Python-Abhaengigkeiten
        run: uv sync

      # Modell frisch am Pegel Over kalibrieren (tau/Gewichte/Offset), damit die
      # Seite nicht mit den Entfernungs-Defaults rechnet. Schlaegt die
      # Kalibrierung fehl (PEGELONLINE nicht erreichbar), entsteht kein
      # params.json und export_web.py laeuft mit den Defaults weiter.
      - name: Modell kalibrieren (PEGELONLINE)
        continue-on-error: true
        run: uv run python calibrate.py --days 30 --out params.json

      - name: data.json erzeugen (BSH + PEGELONLINE)
        run: uv run python export_web.py --out web/public --bias-correct

      # Vorhergesagtes "Wasser auf dem Gelaende" -> GitHub-Issue anlegen/aktualisieren
      # und aaronspring taggen. Idempotent (ein Issue pro Event, Abgleich ueber
      # offene Issues), daher fuer alle Trigger sicher. Blockiert den Deploy nicht.
      - name: Ueberflutungs-Alarm (Issues)
        id: alerts
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: uv run python alert_issues.py --data web/public/data.json

      # continue-on-error verschluckt Fehler des Alarm-Schritts -- gerade bei
      # Sturmflut darf das nicht unbemerkt bleiben. Solange dazu schon ein
      # offenes Issue existiert, wird kein weiteres angelegt (kein Spam bei
      # stuendlichen Laeufen).
      - name: Fehler im Alarm-Schritt melden (Issue)
        if: steps.alerts.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Alarm-Schritt fehlgeschlagen (alert_issues.py)"
          existing=$(gh issue list --state open --search "in:title \"$title\"" \
            --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body "@aaronspring — \`alert_issues.py\` ist im Deploy-Workflow fehlgeschlagen; Ueberflutungs-Alarme werden derzeit NICHT erzeugt. Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web-Abhaengigkeiten installieren
        run: npm ci
        working-directory: web
      - name: Frontend bauen
        run: npm run build
        working-directory: web

      - name: Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Nach GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4
