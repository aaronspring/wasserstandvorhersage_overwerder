[project]
name = "wasserstand-overwerder"
version = "0.1.0"
description = "Wasserstandsvorhersage fuer Overwerder Bogen 79 (Tideelbe) aus BSH-Vorhersagen"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "aaronspring", email = "draaronspring@proton.me" }]
keywords = ["tideelbe", "wasserstand", "bsh", "pegelonline", "forecast"]
dependencies = [
    "requests>=2.28",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.urls]
Repository = "https://github.com/aaronspring/wasserstandvorhersage_overwerder"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wasserstand_overwerder"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
